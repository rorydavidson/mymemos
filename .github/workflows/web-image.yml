name: Web image

# Builds the web client's container on every pull request that could change it, so a broken
# Dockerfile is caught before merge. A merge to main (a push there) also publishes it to the
# GitHub Container Registry as ghcr.io/<owner>/mymemos-web, tagged latest and with the commit.
#
# Third-party actions are pinned to commits, since the publish job holds a token that can
# write packages; Dependabot proposes updates.
on:
  pull_request:
    paths:
      - "web/**"
      - "core-model/**"
      - "core-network/**"
      - "core-data/src/commonMain/**"
      - "core-data/src/commonTest/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "kotlin-js-store/**"
      - ".dockerignore"
      - ".github/workflows/web-image.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests: build only, with a read-only token, since their code runs in the build.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha

  # main: build and publish.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mymemos-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
