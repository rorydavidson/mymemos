name: Web image

# Builds the web client's container on every pull request that could change it, so a broken
# Dockerfile is caught before merge. A merge to main (a push there) also publishes it to the
# GitHub Container Registry as ghcr.io/<owner>/mymemos-web, tagged latest and with the commit.
on:
  pull_request:
    paths:
      - "web/**"
      - "core-model/**"
      - "core-network/**"
      - "core-data/src/commonMain/**"
      - "core-data/src/commonTest/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "kotlin-js-store/**"
      - ".dockerignore"
      - ".github/workflows/web-image.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used on main, where the image is pushed.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mymemos-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
