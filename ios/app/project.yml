# The Xcode project, generated by XcodeGen (`xcodegen generate`, or `build.sh`). The
# .xcodeproj is git-ignored; this file is the source of truth.
name: MyMemos
options:
  bundleIdPrefix: com.keltruc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Gradle writes the framework under apple/shared/build, outside this project's folder,
    # which Xcode's script sandbox would otherwise refuse.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MyMemos:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../apple/ui
        name: SharedUI
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keltruc.mymemos.ios
        PRODUCT_NAME: MyMemos
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Where embedAndSignAppleFrameworkForXcode puts the Kotlin framework for this
        # configuration and SDK. It is static, so it is linked rather than embedded.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../apple/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          - "-lsqlite3"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MyMemos
        CFBundleName: MyMemos
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIAppFonts:
          - GoogleSansFlex.ttf
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Your location is read only when you choose to add it to a memo, and is stored with that memo on your own server.
        NSPhotoLibraryAddUsageDescription: Saving an attachment to your photos.
        NSHumanReadableCopyright: Bundles Google Sans Flex under the SIL Open Font License 1.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.keltruc.mymemos.ios.refresh
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          export JAVA_HOME="${JAVA_HOME:-/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home}"
          ./gradlew :apple-shared:embedAndSignAppleFrameworkForXcode --console=plain -q

schemes:
  MyMemos:
    build:
      targets:
        MyMemos: all
    run:
      config: Debug
    archive:
      config: Release
