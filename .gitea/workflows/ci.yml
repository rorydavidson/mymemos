name: CI
on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Platforms carry a minor version now: "android-37" no longer resolves.
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Release APK
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$STORE_FILE" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$STORE_FILE"
          fi
          ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

  # The web client: the shared rules and the web store under Node, then the UI's typecheck
  # and production build. -PwebOnly keeps the Android SDK out of it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Web core tests and library
        run: ./gradlew -PwebOnly --console=plain :web-core:test :web-core:jsBrowserProductionLibraryDistribution
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: UI typecheck and build
        working-directory: web/app
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # Apple targets cannot be built anywhere but macOS, so this needs a runner with that label.
  # Without one the job simply never runs, which is worth knowing: it does not fail, it waits.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Shared code, on the native target
        run: |
          ./gradlew --console=plain \
            :core-data:macosArm64Test \
            :core-network:macosArm64Test \
            :core-database:macosArm64Test

      - name: Build the macOS app
        run: macos/app/build.sh

      # The iOS app, built for the simulator with swiftc the same way, so a change to the
      # shared SwiftUI that only breaks on UIKit is caught here rather than on a phone.
      - name: Build the iOS app
        run: ios/app/build.sh

      # These check things whose failure is silent: a cipher that stopped agreeing with
      # Android, a font that quietly fell back, an appearance that would not persist, a list
      # continuation that returned nil and did nothing.
      - name: Checks
        run: |
          macos/app/check-cipher.sh
          macos/app/check-font.sh
          macos/app/check-appearance.sh
          macos/app/check-editor.sh

      # Tar first: upload-artifact zips, and a zipped .app loses the symlinks and the
      # executable bit, so what you download would not launch.
      - name: Archive the bundle
        run: tar -czf MyMemos.app.tar.gz -C macos/app/build MyMemos.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: MyMemos.app.tar.gz

      - name: Archive the iOS simulator bundle
        run: tar -czf MyMemos-ios-simulator.app.tar.gz -C ios/app/build MyMemos.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: MyMemos-ios-simulator.app.tar.gz
